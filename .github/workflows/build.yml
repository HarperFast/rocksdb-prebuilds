name: Automated RocksDB Builds

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      rocksdb_version:
        description: RocksDB version to rebuild (defaults to the latest official release)
        required: false
        type: string
      prerelease_revision:
        description: Numeric prerelease revision for publishing a prerelease build of a RocksDB version (e.g. `1` for v11.1.2-1 or `rc2` for v11.1.2-rc2)
        required: false
        type: string

jobs:
  check:
    name: Check for new release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check-build.outputs.should_build }}
      version: ${{ steps.latest-rocksdb.outputs.version }}
      release_version: ${{ steps.check-build.outputs.release_version }}
      mismatch_note: ${{ steps.latest-rocksdb.outputs.mismatch_note }}
    steps:
      - name: Get latest RocksDB release
        id: latest-rocksdb
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.rocksdb_version }}"
          if [[ -n "$REQUESTED" ]]; then
            TAG="${REQUESTED#v}"
          else
            URL="https://api.github.com/repos/facebook/rocksdb/releases/latest"
            TAG=$(curl -s -L -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" -X GET "$URL" | jq -r '.tag_name' | tr -d 'v')
          fi
          echo "Latest RocksDB release tag: v$TAG"

          # Derive the published version from the bundled version.h, not the tag name.
          # version.h is what the compiled library (and rocksdb-js) actually reports, so
          # it is our source of truth. Upstream has shipped tags whose name disagrees with
          # version.h (e.g. the v11.8.0 tag actually contains 11.8.1).
          VERSION_H_URL="https://raw.githubusercontent.com/facebook/rocksdb/v${TAG}/include/rocksdb/version.h"
          VERSION_H="$(curl -sfL "$VERSION_H_URL")"
          MAJOR="$(printf '%s\n' "$VERSION_H" | sed -n 's/^#define ROCKSDB_MAJOR \([0-9][0-9]*\).*/\1/p')"
          MINOR="$(printf '%s\n' "$VERSION_H" | sed -n 's/^#define ROCKSDB_MINOR \([0-9][0-9]*\).*/\1/p')"
          PATCH="$(printf '%s\n' "$VERSION_H" | sed -n 's/^#define ROCKSDB_PATCH \([0-9][0-9]*\).*/\1/p')"
          if [[ -z "$MAJOR" || -z "$MINOR" || -z "$PATCH" ]]; then
            echo "Failed to parse version.h from $VERSION_H_URL" >&2
            printf '%s\n' "$VERSION_H" >&2
            exit 1
          fi
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Version from version.h: $VERSION"

          MISMATCH_NOTE=""
          if [[ "$VERSION" != "$TAG" ]]; then
            MISMATCH_NOTE="**⚠️ Version mismatch:** upstream RocksDB tag v${TAG} does not match its bundled version.h (${VERSION}). This prebuild was built from the v${TAG} tag but is published as v${VERSION} to match the version the compiled library reports."
            echo "::warning title=RocksDB version mismatch::tag v${TAG} != version.h ${VERSION}; publishing as v${VERSION}"
            echo "=================================================================="
            echo "  RocksDB VERSION MISMATCH"
            echo "  upstream tag : v${TAG}"
            echo "  version.h    : ${VERSION}"
            echo "  Publishing as v${VERSION} (version.h is the source of truth)."
            echo "=================================================================="
          fi

          # version = the upstream tag (used to download the source and link to the
          # upstream release); version_h = the version we publish as.
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_h=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "mismatch_note<<MMEOF"
            echo "$MISMATCH_NOTE"
            echo "MMEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get latest prebuild
        id: latest-prebuild
        shell: bash
        run: |
          URL="https://api.github.com/repos/harperdb/rocksdb-prebuilds/releases/latest"
          LATEST=$(curl -s -L -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" -X GET "$URL" | jq -r '.tag_name' | tr -d 'v')
          echo "Latest RocksDB prebuild: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Check if we should build
        id: check-build
        shell: bash
        run: |
          # Compare and publish using the version.h-derived version; the tag is only
          # the download locator.
          ROCKSDB_VERSION="${{ steps.latest-rocksdb.outputs.version_h }}"
          TAG_VERSION="${{ steps.latest-rocksdb.outputs.version }}"
          REVISION="${{ inputs.prerelease_revision }}"
          SHOULD_BUILD=false

          if [[ -n "$REVISION" ]]; then
            if [[ ! "$REVISION" =~ ^[0-9]+$ ]]; then
              echo "prerelease_revision must be numeric" >&2
              exit 1
            fi
            RELEASE_VERSION="${ROCKSDB_VERSION}-${REVISION}"
            SHOULD_BUILD=true
            echo "Building RocksDB v$ROCKSDB_VERSION (tag v$TAG_VERSION) prerelease as v$RELEASE_VERSION"
          elif [[ "$ROCKSDB_VERSION" != "${{ steps.latest-prebuild.outputs.version }}" ]]; then
            RELEASE_VERSION="$ROCKSDB_VERSION"
            SHOULD_BUILD=true
            echo "New RocksDB release!"
          else
            RELEASE_VERSION="$ROCKSDB_VERSION"
            echo "No new RocksDB release"
          fi

          if [[ "$SHOULD_BUILD" == true ]]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$RELEASE_VERSION")
            if [[ "$STATUS" == 200 ]]; then
              echo "Release v$RELEASE_VERSION already exists; choose a new revision" >&2
              exit 1
            elif [[ "$STATUS" != 404 ]]; then
              echo "Unable to check release v$RELEASE_VERSION (HTTP $STATUS)" >&2
              exit 1
            fi
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: [check]
    if: ${{ needs.check.outputs.should_build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-latest
            target: darwin-arm64
            triplet: arm64-osx-static
          - runner: macos-latest
            target: darwin-x64
            triplet: x64-osx-static
          - runner: ubuntu-22.04
            target: linux-x64-glibc
            triplet: x64-linux
          - runner: ubuntu-22.04-arm
            target: linux-arm64-glibc
            triplet: arm64-linux
          - runner: ubuntu-latest
            target: linux-x64-musl
            triplet: x64-linux-musl-static
          - runner: ubuntu-24.04-arm
            target: linux-arm64-musl
            triplet: arm64-linux-musl-static
          - runner: windows-latest
            target: windows-x64
            triplet: x64-windows-static
          - runner: windows-latest
            target: windows-x64-static-md
            triplet: x64-windows-static-md
          - runner: windows-latest
            target: windows-arm64
            triplet: arm64-windows-static
          - runner: windows-latest
            target: windows-arm64-static-md
            triplet: arm64-windows-static-md
    runs-on: ${{ matrix.platform.runner }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cmake
        if: ${{ matrix.platform.target != 'linux-x64-musl' && matrix.platform.target != 'linux-arm64-musl' }}
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.10

      - name: Download and patch RocksDB
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "Installing vcpkg..."
          # Pin vcpkg to a baseline release for reproducible dependency builds.
          # 2026.06.24 is the last release before vcpkg's scripts began requiring
          # CMake's string(JSON ... STRING_ENCODE) (4.x), which the CMake available
          # in these runners (3.31.10 / Alpine musl) does not provide.
          git clone --branch 2026.06.24 https://github.com/microsoft/vcpkg

          URL="https://github.com/facebook/rocksdb/archive/refs/tags/v${{ needs.check.outputs.version }}.tar.gz"
          echo "Downloading: $URL"
          curl -L -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" -o rocksdb.tar.gz "$URL"
          tar -xzf rocksdb.tar.gz
          cp windows/thirdparty.inc "${GITHUB_WORKSPACE}/rocksdb-${{ needs.check.outputs.version }}/"

          mkdir dist

          for patch in "${GITHUB_WORKSPACE}/vcpkg-overlays/rocksdb/patches"/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying patch: $patch"
              patch -p1 -d "${GITHUB_WORKSPACE}/rocksdb-${{ needs.check.outputs.version }}" < "$patch"
            fi
          done

      - name: Build RocksDB (macos/linux glibc/windows)
        if: ${{ matrix.platform.target != 'linux-x64-musl' && matrix.platform.target != 'linux-arm64-musl' }}
        timeout-minutes: 60
        env:
          ROCKSDB_DIR: ${{ github.workspace }}/rocksdb-${{ needs.check.outputs.version }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_TRIPLET: ${{ matrix.platform.triplet }}
        shell: bash
        run: |
          set -e
          set -o pipefail

          if [[ "${{ matrix.platform.target }}" == windows-* ]]; then
            $VCPKG_ROOT/bootstrap-vcpkg.bat
            VCPKG_CMD="$VCPKG_ROOT/vcpkg.exe"
            # VS ships a bundled vcpkg that overrides VCPKG_ROOT; rename it if present.
            # Path varies by VS version (2022 -> .../2022/..., 2026 -> .../18/...).
            shopt -s nullglob
            for vs_vcpkg in "C:/Program Files/Microsoft Visual Studio/"*/Enterprise/VC/vcpkg; do
              if [[ -d "$vs_vcpkg" ]]; then
                echo "Renaming VS bundled vcpkg to avoid overriding VCPKG_ROOT: $vs_vcpkg"
                mv "$vs_vcpkg" "${vs_vcpkg}2"
              fi
            done
            shopt -u nullglob
          else
            $VCPKG_ROOT/bootstrap-vcpkg.sh
            VCPKG_CMD="$VCPKG_ROOT/vcpkg"
          fi

          export REAL_VCPKG_ROOT=$VCPKG_ROOT
          export VCPKG_KEEP_ENV_VARS="REAL_VCPKG_ROOT;ROCKSDB_DIR;VCPKG_CMD;VCPKG_ROOT;VCPKG_TRIPLET"

          if ! $VCPKG_CMD install rocksdb \
            --debug \
            --triplet ${{ matrix.platform.triplet }} \
            --overlay-ports="${GITHUB_WORKSPACE}/vcpkg-overlays" \
            --overlay-triplets="${GITHUB_WORKSPACE}/vcpkg-triplets"; then
            echo '=== Build failed, dumping logs ==='
            echo '=== buildtrees/detect_compiler/config-${{ matrix.platform.triplet }}-out.log ==='
            cat ${GITHUB_WORKSPACE}/vcpkg/buildtrees/detect_compiler/config-${{ matrix.platform.triplet }}-out.log 2>/dev/null || echo 'Log file not found'
            echo '=== buildtrees/detect_compiler/config-${{ matrix.platform.triplet }}-rel-CMakeCache.txt.log ==='
            cat ${GITHUB_WORKSPACE}/vcpkg/buildtrees/detect_compiler/config-${{ matrix.platform.triplet }}-rel-CMakeCache.txt.log 2>/dev/null || echo 'Log file not found'
            echo '=== buildtrees/rocksdb/config-${{ matrix.platform.triplet }}-out.log ==='
            cat ${GITHUB_WORKSPACE}/vcpkg/buildtrees/rocksdb/config-${{ matrix.platform.triplet }}-out.log 2>/dev/null || echo 'Log file not found'
            echo '=== buildtrees/rocksdb/config-${{ matrix.platform.triplet }}-err.log ==='
            cat ${GITHUB_WORKSPACE}/vcpkg/buildtrees/rocksdb/config-${{ matrix.platform.triplet }}-err.log 2>/dev/null || echo 'Log file not found'
            echo '=== buildtrees/rocksdb/install-${{ matrix.platform.triplet }}-dbg-out.log ==='
            cat ${GITHUB_WORKSPACE}/vcpkg/buildtrees/rocksdb/install-${{ matrix.platform.triplet }}-dbg-out.log 2>/dev/null || echo 'Log file not found'
            echo '=== buildtrees/rocksdb/install-${{ matrix.platform.triplet }}-dbg-err.log ==='
            cat ${GITHUB_WORKSPACE}/vcpkg/buildtrees/rocksdb/install-${{ matrix.platform.triplet }}-dbg-err.log 2>/dev/null || echo 'Log file not found'
            exit 1
          fi

          cp -r "$VCPKG_ROOT/installed/${{ matrix.platform.triplet }}"/* "${GITHUB_WORKSPACE}/dist/"

      - name: Build RocksDB (linux musl)
        if: ${{ matrix.platform.target == 'linux-x64-musl' || matrix.platform.target == 'linux-arm64-musl' }}
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e "ROCKSDB_DIR=/workspace/rocksdb-${{ needs.check.outputs.version }}" \
            -e VCPKG_FORCE_SYSTEM_BINARIES=1 \
            -w /workspace \
            alpine:latest \
            sh -c "
              set -e
              set -o pipefail

              echo \"=== ROCKSDB_DIR ===\"
              echo \"\$ROCKSDB_DIR\"

              echo \"=== Architecture ===\"
              uname -m

              echo \"=== Installing packages ===\"
              apk add --no-cache \
                build-base \
                cmake \
                curl \
                git \
                linux-headers \
                musl-dev \
                ninja \
                pkgconf \
                zip

              echo \"=== Bootstrapping vcpkg ===\"
              /workspace/vcpkg/bootstrap-vcpkg.sh -musl

              echo \"=== vcpkg directory after ===\"
              find /workspace/vcpkg/downloads || true

              echo \"=== Installing RocksDB ===\"
              if ! /workspace/vcpkg/vcpkg install rocksdb \
                --triplet ${{ matrix.platform.triplet }} \
                --overlay-ports=/workspace/vcpkg-overlays \
                --overlay-triplets=/workspace/vcpkg-triplets; then
                echo '=== Build failed, dumping logs ==='
                echo '=== install-${{ matrix.platform.triplet }}-dbg-out.log ==='
                cat /workspace/vcpkg/buildtrees/rocksdb/install-${{ matrix.platform.triplet }}-dbg-out.log 2>/dev/null || echo 'Log file not found'
                echo '=== install-${{ matrix.platform.triplet }}-dbg-err.log ==='
                cat /workspace/vcpkg/buildtrees/rocksdb/install-${{ matrix.platform.triplet }}-dbg-err.log 2>/dev/null || echo 'Log file not found'
                exit 1
              fi

              cp -r /workspace/vcpkg/installed/${{ matrix.platform.triplet }}/* /workspace/dist/
            "

      - name: Verify LZ4 is packaged
        shell: bash
        run: |
          if [[ "${{ matrix.platform.target }}" == windows-* ]]; then
            test -f "${GITHUB_WORKSPACE}/dist/lib/lz4.lib"
          else
            test -f "${GITHUB_WORKSPACE}/dist/lib/liblz4.a"
          fi

      - name: Create archive
        id: archive
        shell: bash
        run: |
          ARCHIVE="${GITHUB_WORKSPACE}/rocksdb-${{ needs.check.outputs.release_version }}-${{ matrix.platform.target }}.tar.xz"
          cd "${GITHUB_WORKSPACE}/dist"
          tar -cf - . | xz -9 > $ARCHIVE
          echo "archive=$ARCHIVE" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rocksdb-${{ needs.check.outputs.release_version }}-${{ matrix.platform.target }}
          path: ${{ steps.archive.outputs.archive }}

  release:
    name: Release
    needs: [check, build]
    if: ${{ needs.check.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload artifacts to S3
        run: |
          aws s3 cp artifacts/ s3://harper-artifacts/rocksdb-prebuilds/v${{ needs.check.outputs.release_version }}/ --recursive

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.xz
          body: |
            Automated prebuilds for RocksDB v${{ needs.check.outputs.release_version }}.

            ${{ needs.check.outputs.mismatch_note }}

            Built from upstream tag v${{ needs.check.outputs.version }} — release notes: https://github.com/facebook/rocksdb/releases/tag/v${{ needs.check.outputs.version }}
          name: RocksDB v${{ needs.check.outputs.release_version }}
          tag_name: v${{ needs.check.outputs.release_version }}
          prerelease: ${{ inputs.prerelease_revision != '' }}
          token: ${{ secrets.GH_TOKEN }}

  on-release-success:
    if: success() && !cancelled() && needs.check.outputs.should_build == 'true'
    name: Release success
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CI_CHANNEL_ID }}",
              "text": "New RocksDB prebuild: v${{ needs.check.outputs.release_version }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "New RocksDB prebuild: v${{ needs.check.outputs.release_version }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": ":white_check_mark:"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<https://github.com/harperdb/rocksdb-prebuilds/releases/tag/v${{ needs.check.outputs.release_version }}|GitHub Release>"
                    }
                  ]
                }
              ]
            }

      - name: Repository Dispatch
        if: ${{ inputs.prerelease_revision == '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: new-rocksdb-prebuild
          repository: harperdb/rocksdb-js
          token: ${{ secrets.GH_TOKEN }}
          client-payload: |
            {
              "url": "https://github.com/harperdb/rocksdb-prebuilds/releases/tag/v${{ needs.check.outputs.release_version }}",
              "version": "${{ needs.check.outputs.release_version }}"
            }

  on-release-failure:
    if: failure() && !cancelled() && needs.check.outputs.should_build == 'true'
    name: Release failure
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CI_CHANNEL_ID }}",
              "text": "RocksDB prebuild failed: v${{ needs.check.outputs.release_version }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "RocksDB prebuild failed: v${{ needs.check.outputs.release_version }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": ":x:"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run ${{ github.run_id }}>"
                    }
                  ]
                }
              ]
            }
