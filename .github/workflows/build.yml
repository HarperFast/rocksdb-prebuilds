name: Automated RocksDB Builds

# Workflow-level `concurrency` cannot see `needs`, so this key approximates the release
# version from the raw inputs the `check` job composes it from; the `release` job holds
# the exact one. Empty inputs share a group on purpose: they resolve to the same version.
# A pull request runs only `validate`, which publishes nothing, so it gets a per-PR group
# instead: its `inputs` are all empty, so sharing the release key would put it in the same
# group as the nightly build, where a queued run cancels whatever is already pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('{0}-{1}-{2}', inputs.rocksdb_version, inputs.prerelease_revision, inputs.experimental_patches) }}
  # Superseding a PR's own in-flight validation is what should happen; superseding a
  # release build is not, and the two can no longer land in one group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Only the inputs the validate job actually builds from: it applies the
  # patches to a real RocksDB tree and runs upstream tests, which is too slow
  # to spend on a pull request that cannot affect the result.
  pull_request:
    paths:
      - "experimental-patches/**"
      - "vcpkg-overlays/rocksdb/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      rocksdb_version:
        description: RocksDB version to rebuild (defaults to the latest official release)
        required: false
        type: string
      prerelease_revision:
        description: Prerelease revision for publishing a prerelease build of a RocksDB version. A single semver prerelease identifier - lowercase letters, digits, and hyphens only, no dots, no leading zero on a purely numeric value, and not starting with `experimental` (e.g. `1` for v11.1.2-1 or `rc2` for v11.1.2-rc2)
        required: false
        type: string
      experimental_patches:
        description: Comma-separated experimental patch ids to apply on top of the official patches (e.g. `1, 3, 4`). See experimental-patches/README.md. Produces a prerelease build.
        required: false
        type: string

jobs:
  validate:
    name: Validate experimental patches
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audit dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Apply and verify each experimental patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          run_hook() {   # name, dir, hook file -- present but non-executable is an error,
                         # never a silent skip
            local name="$1" hook="$2" src="$3"
            [[ -f "$hook" ]] || return 0
            if [[ ! -x "$hook" ]]; then
              echo "::error::$name: $(basename "$hook") is not executable; chmod +x it"
              return 1
            fi
            echo "Running $(basename "$hook") for $name"
            "$hook" "$src"
          }

          for dir in experimental-patches/*/; do
            name="$(basename "$dir")"

            # Each patch pins the release its author verified it against. Without
            # that we do not know what to build, so there is nothing to gate on.
            if [[ ! -f "${dir}patched-version.txt" ]]; then
              echo "::notice::$name has no patched-version.txt; skipping build gate"
              continue
            fi
            TAG="$(tr -d '[:space:]' < "${dir}patched-version.txt")"
            SRC="rocksdb-${TAG#v}"

            echo "::group::$name against $TAG"
            rm -rf "$SRC"
            curl -sfL -o rocksdb.tar.gz \
              "https://github.com/facebook/rocksdb/archive/refs/tags/${TAG}.tar.gz"
            tar -xzf rocksdb.tar.gz

            .github/scripts/apply-patches.sh "$SRC" "$name"
            run_hook "$name" "${dir}audit.sh" "$SRC"
            run_hook "$name" "${dir}test.sh" "$SRC"
            echo "::endgroup::"
          done

  check:
    name: Check for new release
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check-build.outputs.should_build }}
      version: ${{ steps.latest-rocksdb.outputs.version }}
      release_version: ${{ steps.check-build.outputs.release_version }}
      mismatch_note: ${{ steps.latest-rocksdb.outputs.mismatch_note }}
      experimental_dirs: ${{ steps.experimental.outputs.dirs }}
      experimental_note: ${{ steps.experimental.outputs.note }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve experimental patches
        id: experimental
        shell: bash
        env:
          # Via env, not inline ${{ }}, so the value is data the script reads rather
          # than text spliced into the script source before bash parses it.
          RAW: ${{ inputs.experimental_patches }}
        run: |
          set -euo pipefail
          ROOT="experimental-patches"
          source .github/scripts/experimental-ids.sh

          # Treat CR/newlines (a multiline dispatch value) as delimiters, replacing them
          # with commas: `read -ra` below stops at the first newline and would silently
          # drop later ids. Replacing rather than deleting CR avoids coalescing a lone
          # interior CR (`1<CR>2` -> `1,2`, two ids, not `12`).
          RAW="${RAW//$'\r'/,}"
          RAW="${RAW//$'\n'/,}"

          # Input of only whitespace/commas (e.g. ", ," or a stray tab) means no
          # experimental patches: strip both so it takes the empty path rather than
          # emitting an empty-list "experimental" build whose release body claims
          # downstream patches it never applied.
          if [[ -z "${RAW//[[:space:],]/}" ]]; then
            echo "dirs=" >> "$GITHUB_OUTPUT"
            echo "segment=" >> "$GITHUB_OUTPUT"
            { echo "note<<EOF"; echo; echo "EOF"; } >> "$GITHUB_OUTPUT"
            echo "No experimental patches requested."
            exit 0
          fi

          # Map each experimental-patches/<id>-<slug> dir to its canonical id.
          # Numeric ids collapse by value (1 == 01 == 0001); others are exact strings.
          # Every invariant is re-checked here, not just uniqueness: the validator gates
          # merged code, but this resolver also runs on branches that never passed it.
          declare -A dir_by_id dir_by_ckey
          for dir in "$ROOT"/*/; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            if ! problems="$(validate_patch_dir "$dir")"; then
              echo "Invalid experimental patch directory:" >&2
              printf '  %s\n' "$problems" >&2
              exit 1
            fi
            did="${name%%-*}"
            key="$(canon_id "$did")"
            ckey="$(canon_collision_key "$did")"
            if [[ -n "${dir_by_ckey[$ckey]:-}" ]]; then
              echo "Conflicting experimental patch ids: '$name' and '${dir_by_ckey[$ckey]}' share id '$did'" >&2
              exit 1
            fi
            dir_by_ckey[$ckey]="$name"
            dir_by_id[$key]="$name"
          done

          declare -A seen
          keys=()
          IFS=',' read -ra REQ <<< "$RAW"
          for raw_id in "${REQ[@]}"; do
            read -r id <<< "$raw_id"   # trim surrounding whitespace only; interior space makes an invalid id fail loudly
            [[ -z "$id" ]] && continue
            key="$(canon_id "$id")"
            if [[ -z "${dir_by_id[$key]:-}" ]]; then
              echo "No experimental patch for id '$id'. Available ids:" >&2
              for k in "${!dir_by_id[@]}"; do echo "  - ${dir_by_id[$k]}" >&2; done
              exit 1
            fi
            [[ -n "${seen[$key]:-}" ]] && continue
            seen[$key]=1
            keys+=("$key")
          done

          # Numeric ids sort ascending by value and before any string ids; sorting by
          # digit-count first keeps arbitrary-length ids exact without arithmetic.
          sorted=$(for k in "${keys[@]}"; do
            if [[ "$k" == n:* ]]; then num="${k#n:}"; printf '0\t%04d\t%s\t%s\n' "${#num}" "$num" "$k"
            else printf '1\t0000\t%s\t%s\n' "${k#s:}" "$k"; fi
          done | sort | cut -f4)

          dirs=""; segment=""; note=""
          for k in $sorted; do
            name="${dir_by_id[$k]}"
            id="${k#n:}"; id="${id#s:}"
            dirs="${dirs:+$dirs }$name"
            segment="${segment:+$segment-}$id"
            note="${note}"$'\n'"- \`$id\` — [$name](https://github.com/${{ github.repository }}/tree/${{ github.sha }}/experimental-patches/$name)"
          done

          echo "Applying experimental patches (in order): $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "segment=$segment" >> "$GITHUB_OUTPUT"
          {
            echo "note<<EOF"
            echo "**⚠️ Experimental build** — includes downstream experimental patches:"
            echo "$note"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get latest RocksDB release
        id: latest-rocksdb
        shell: bash
        env:
          REQUESTED: ${{ inputs.rocksdb_version }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED" ]]; then
            TAG="${REQUESTED#v}"
          else
            URL="https://api.github.com/repos/facebook/rocksdb/releases/latest"
            TAG=$(curl -s -L -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" -X GET "$URL" | jq -r '.tag_name' | tr -d 'v')
          fi
          # TAG becomes a job output that later steps interpolate into shell bodies and
          # a download URL, so constrain it to a tag-shaped token here rather than at
          # each use. Permissive about upstream's naming, strict about metacharacters.
          if [[ ! "$TAG" =~ ^[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "Refusing to build RocksDB tag 'v$TAG': expected a version-shaped tag" >&2
            exit 1
          fi
          echo "Latest RocksDB release tag: v$TAG"

          # Derive the published version from the bundled version.h, not the tag name.
          # version.h is what the compiled library (and rocksdb-js) actually reports, so
          # it is our source of truth. Upstream has shipped tags whose name disagrees with
          # version.h (e.g. the v11.8.0 tag actually contains 11.8.1).
          VERSION_H_URL="https://raw.githubusercontent.com/facebook/rocksdb/v${TAG}/include/rocksdb/version.h"
          VERSION_H="$(curl -sfL "$VERSION_H_URL")"
          MAJOR="$(printf '%s\n' "$VERSION_H" | sed -n 's/^#define ROCKSDB_MAJOR \([0-9][0-9]*\).*/\1/p')"
          MINOR="$(printf '%s\n' "$VERSION_H" | sed -n 's/^#define ROCKSDB_MINOR \([0-9][0-9]*\).*/\1/p')"
          PATCH="$(printf '%s\n' "$VERSION_H" | sed -n 's/^#define ROCKSDB_PATCH \([0-9][0-9]*\).*/\1/p')"
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          # Each sed prints one line per matching #define, so a duplicated define yields a
          # multiline component, which corrupts the $GITHUB_OUTPUT write below. Checking
          # the composed shape catches that as well as a failed parse.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Failed to parse a version from version.h at $VERSION_H_URL (got '$VERSION')" >&2
            printf '%s\n' "$VERSION_H" >&2
            exit 1
          fi
          echo "Version from version.h: $VERSION"

          MISMATCH_NOTE=""
          if [[ "$VERSION" != "$TAG" ]]; then
            MISMATCH_NOTE="**⚠️ Version mismatch:** upstream RocksDB tag v${TAG} does not match its bundled version.h (${VERSION}). This prebuild was built from the v${TAG} tag but is published as v${VERSION} to match the version the compiled library reports."
            echo "::warning title=RocksDB version mismatch::tag v${TAG} != version.h ${VERSION}; publishing as v${VERSION}"
            echo "=================================================================="
            echo "  RocksDB VERSION MISMATCH"
            echo "  upstream tag : v${TAG}"
            echo "  version.h    : ${VERSION}"
            echo "  Publishing as v${VERSION} (version.h is the source of truth)."
            echo "=================================================================="
          fi

          # version = the upstream tag (used to download the source and link to the
          # upstream release); version_h = the version we publish as.
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_h=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "mismatch_note<<MMEOF"
            echo "$MISMATCH_NOTE"
            echo "MMEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get latest prebuild
        id: latest-prebuild
        shell: bash
        run: |
          URL="https://api.github.com/repos/harperdb/rocksdb-prebuilds/releases/latest"
          LATEST=$(curl -s -L -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" -X GET "$URL" | jq -r '.tag_name' | tr -d 'v')
          echo "Latest RocksDB prebuild: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Check if we should build
        id: check-build
        shell: bash
        env:
          REVISION: ${{ inputs.prerelease_revision }}
        run: |
          # Compare and publish using the version.h-derived version; the tag is only
          # the download locator.
          ROCKSDB_VERSION="${{ steps.latest-rocksdb.outputs.version_h }}"
          TAG_VERSION="${{ steps.latest-rocksdb.outputs.version }}"
          SEGMENT="${{ steps.experimental.outputs.segment }}"
          SHOULD_BUILD=false

          if [[ -n "$REVISION" ]]; then
            # One semver prerelease identifier. No dots: the composition below joins the
            # revision to an id list with a dot, so a dotted revision would blur that
            # boundary. No leading zero when purely numeric, per
            # https://semver.org/#spec-item-9.
            if [[ ! "$REVISION" =~ ^[0-9a-z-]+$ || ! "$REVISION" =~ [0-9a-z] ]]; then
              echo "prerelease_revision must be lowercase letters, digits, and hyphens, with no dots and at least one letter or digit (got '$REVISION')" >&2
              exit 1
            fi
            if [[ "$REVISION" =~ ^[0-9]+$ && "$REVISION" =~ ^0[0-9] ]]; then
              echo "prerelease_revision must not have a leading zero when purely numeric (got '$REVISION')" >&2
              exit 1
            fi
            # Otherwise a revision could mint a tag in the namespace the experimental
            # path owns: `-experimental-2` with no patches applied publishes vanilla
            # contents under that name and then blocks the real experimental build for
            # id 2, which the numeric-only grammar made impossible.
            if [[ "$REVISION" == experimental || "$REVISION" == experimental-* ]]; then
              echo "prerelease_revision must not start with 'experimental': that prefix is reserved for experimental_patches builds (got '$REVISION')" >&2
              exit 1
            fi
          fi

          # Compose the release version: <version>[-experimental-<ids>][<rev>].
          # Ids join with hyphens; the revision is appended with a dot so an id list
          # and a revision can never be confused (e.g. exp {1} rev 2 -> `-1.2`, which
          # is distinct from exp {1,2} -> `-1-2`). Both remain valid semver.
          RELEASE_VERSION="$ROCKSDB_VERSION"
          if [[ -n "$SEGMENT" ]]; then
            RELEASE_VERSION="${RELEASE_VERSION}-experimental-${SEGMENT}"
            [[ -n "$REVISION" ]] && RELEASE_VERSION="${RELEASE_VERSION}.${REVISION}"
          elif [[ -n "$REVISION" ]]; then
            RELEASE_VERSION="${RELEASE_VERSION}-${REVISION}"
          fi

          if [[ -n "$SEGMENT" ]]; then
            SHOULD_BUILD=true
            echo "Building experimental RocksDB v$ROCKSDB_VERSION (tag v$TAG_VERSION) as v$RELEASE_VERSION"
          elif [[ -n "$REVISION" ]]; then
            SHOULD_BUILD=true
            echo "Building RocksDB v$ROCKSDB_VERSION (tag v$TAG_VERSION) prerelease as v$RELEASE_VERSION"
          elif [[ "$ROCKSDB_VERSION" != "${{ steps.latest-prebuild.outputs.version }}" ]]; then
            SHOULD_BUILD=true
            echo "New RocksDB release!"
          else
            echo "No new RocksDB release"
          fi

          if [[ "$SHOULD_BUILD" == true ]]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-connrefused \
              -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$RELEASE_VERSION" || true)
            if [[ "$STATUS" == 200 ]]; then
              echo "Release v$RELEASE_VERSION already exists; choose a new revision" >&2
              exit 1
            elif [[ "$STATUS" != 404 ]]; then
              echo "Unable to check release v$RELEASE_VERSION (HTTP $STATUS)" >&2
              exit 1
            fi
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

  audit:
    name: Audit experimental patches
    needs: [check]
    if: ${{ needs.check.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audit dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Audit each experimental patch against the release being built
        shell: bash
        env:
          # Only the patches this build actually applies may fail it. Everything else
          # is reported so drift is visible without blocking a release it is not in.
          IN_BUILD: ${{ needs.check.outputs.experimental_dirs }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          VERSION="${{ needs.check.outputs.version }}"
          SRC="rocksdb-${VERSION}"

          # Guarded explicitly: this job gates the build, so a codeload flake must
          # read as infrastructure failure rather than as patch drift.
          if ! curl -sfL -o rocksdb.tar.gz \
            "https://github.com/facebook/rocksdb/archive/refs/tags/v${VERSION}.tar.gz"; then
            echo "::error::could not download RocksDB v$VERSION"
            exit 1
          fi

          blocking=0
          for dir in experimental-patches/*/; do
            name="$(basename "$dir")"
            in_build=0
            for requested in $IN_BUILD; do
              [[ "$requested" == "$name" ]] && in_build=1
            done

            echo "::group::$name against v$VERSION"
            rm -rf "$SRC"
            if ! tar -xzf rocksdb.tar.gz; then
              echo "::error::could not extract RocksDB v$VERSION"
              exit 1
            fi

            # Distinct causes get distinct messages: "rebase it" is wrong advice for a
            # patch that applied cleanly and whose audit found an upstream change.
            problem=""
            if ! .github/scripts/apply-patches.sh "$SRC" "$name"; then
              problem="no longer applies cleanly to RocksDB v$VERSION; rebase it"
            elif [[ -f "${dir}audit.sh" && ! -x "${dir}audit.sh" ]]; then
              problem="has a non-executable audit.sh; chmod +x it"
            elif [[ -x "${dir}audit.sh" ]] && ! "${dir}audit.sh" "$SRC"; then
              problem="applies cleanly but its audit.sh failed; upstream likely changed a site the patch must cover"
            fi

            if [[ -n "$problem" ]]; then
              if [[ "$in_build" -eq 1 ]]; then
                echo "::error::$name $problem -- this build applies it, so it must not ship"
                blocking=1
              else
                echo "::warning::$name $problem -- not applied by this build, so it is not blocking"
              fi
            fi
            echo "::endgroup::"
          done

          if [[ "$blocking" -eq 1 ]]; then
            echo "An experimental patch this build applies failed its audit."
            exit 1
          fi
          echo "No blocking drift for RocksDB v$VERSION."

  build:
    name: Build
    needs: [check, audit]
    if: ${{ needs.check.outputs.should_build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-latest
            target: darwin-arm64
            triplet: arm64-osx-static
            run_probe: true
          - runner: macos-latest
            target: darwin-x64
            triplet: x64-osx-static
            run_probe: false
          - runner: ubuntu-22.04
            target: linux-x64-glibc
            triplet: x64-linux
            run_probe: true
          - runner: ubuntu-22.04-arm
            target: linux-arm64-glibc
            triplet: arm64-linux
            run_probe: true
          - runner: ubuntu-latest
            target: linux-x64-musl
            triplet: x64-linux-musl-static
            run_probe: true
          - runner: ubuntu-24.04-arm
            target: linux-arm64-musl
            triplet: arm64-linux-musl-static
            run_probe: true
          - runner: windows-latest
            target: windows-x64
            triplet: x64-windows-static
            run_probe: true
            probe_cmake_args: -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - runner: windows-latest
            target: windows-x64-static-md
            triplet: x64-windows-static-md
            run_probe: true
            probe_cmake_args: -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          - runner: windows-latest
            target: windows-arm64
            triplet: arm64-windows-static
            run_probe: false
          - runner: windows-latest
            target: windows-arm64-static-md
            triplet: arm64-windows-static-md
            run_probe: false
    runs-on: ${{ matrix.platform.runner }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # ECR Public mirrors Docker Hub's official images without Docker Hub's anonymous-pull token
      # endpoint, whose timeouts failed both musl legs at once. Pinned so the musl toolchain changes
      # only by a reviewed bump.
      MUSL_IMAGE: public.ecr.aws/docker/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cmake
        if: ${{ matrix.platform.target != 'linux-x64-musl' && matrix.platform.target != 'linux-arm64-musl' }}
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # latest as of 2026-10-04
        with:
          cmakeVersion: 3.31.10

      - name: Download and patch RocksDB
        shell: bash
        env:
          # Resolved, validated dir names (ordered by the check job) as data, not
          # spliced into the script source. Charset-validated, so word-splitting is safe.
          EXPERIMENTAL_DIRS: ${{ needs.check.outputs.experimental_dirs }}
        run: |
          set -e
          set -o pipefail

          echo "Installing vcpkg..."
          # Pin vcpkg to a baseline release for reproducible dependency builds.
          # 2026.06.24 is the last release before vcpkg's scripts began requiring
          # CMake's string(JSON ... STRING_ENCODE) (4.x), which the CMake available
          # in these runners (3.31.10 / Alpine musl) does not provide.
          git clone --branch 2026.06.24 https://github.com/microsoft/vcpkg

          URL="https://github.com/facebook/rocksdb/archive/refs/tags/v${{ needs.check.outputs.version }}.tar.gz"
          echo "Downloading: $URL"
          curl -L -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" -o rocksdb.tar.gz "$URL"
          tar -xzf rocksdb.tar.gz
          cp windows/thirdparty.inc "${GITHUB_WORKSPACE}/rocksdb-${{ needs.check.outputs.version }}/"

          mkdir dist

          ROCKSDB_SRC="${GITHUB_WORKSPACE}/rocksdb-${{ needs.check.outputs.version }}"

          # Official patches, then any requested experimental ones. Shared with the
          # PR gate and the nightly audit so they prove the stack this actually ships.
          .github/scripts/apply-patches.sh "$ROCKSDB_SRC" ${EXPERIMENTAL_DIRS}

      - name: Build RocksDB (macos/linux glibc/windows)
        if: ${{ matrix.platform.target != 'linux-x64-musl' && matrix.platform.target != 'linux-arm64-musl' }}
        timeout-minutes: 120
        env:
          ROCKSDB_DIR: ${{ github.workspace }}/rocksdb-${{ needs.check.outputs.version }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_TRIPLET: ${{ matrix.platform.triplet }}
        shell: bash
        run: |
          set -e
          set -o pipefail

          if [[ "${{ matrix.platform.target }}" == windows-* ]]; then
            $VCPKG_ROOT/bootstrap-vcpkg.bat
            VCPKG_CMD="$VCPKG_ROOT/vcpkg.exe"
            # VS ships a bundled vcpkg that overrides VCPKG_ROOT; rename it if present.
            # Path varies by VS version (2022 -> .../2022/..., 2026 -> .../18/...).
            shopt -s nullglob
            for vs_vcpkg in "C:/Program Files/Microsoft Visual Studio/"*/Enterprise/VC/vcpkg; do
              if [[ -d "$vs_vcpkg" ]]; then
                echo "Renaming VS bundled vcpkg to avoid overriding VCPKG_ROOT: $vs_vcpkg"
                mv "$vs_vcpkg" "${vs_vcpkg}2"
              fi
            done
            shopt -u nullglob
          else
            $VCPKG_ROOT/bootstrap-vcpkg.sh
            VCPKG_CMD="$VCPKG_ROOT/vcpkg"
          fi

          export REAL_VCPKG_ROOT=$VCPKG_ROOT
          export VCPKG_KEEP_ENV_VARS="REAL_VCPKG_ROOT;ROCKSDB_DIR;VCPKG_CMD;VCPKG_ROOT;VCPKG_TRIPLET"

          export VCPKG_CMD
          export WORKSPACE="$GITHUB_WORKSPACE"
          export VCPKG_INSTALL_EXTRA_ARGS=--debug
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-rocksdb-variants.sh"

      - name: Pull musl build image
        if: ${{ matrix.platform.target == 'linux-x64-musl' || matrix.platform.target == 'linux-arm64-musl' }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull "$MUSL_IMAGE" && exit 0
            echo "docker pull failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Build RocksDB (linux musl)
        if: ${{ matrix.platform.target == 'linux-x64-musl' || matrix.platform.target == 'linux-arm64-musl' }}
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e "ROCKSDB_DIR=/workspace/rocksdb-${{ needs.check.outputs.version }}" \
            -e VCPKG_FORCE_SYSTEM_BINARIES=1 \
            -e WORKSPACE=/workspace \
            -e VCPKG_ROOT=/workspace/vcpkg \
            -e REAL_VCPKG_ROOT=/workspace/vcpkg \
            -e VCPKG_CMD=/workspace/vcpkg/vcpkg \
            -e "VCPKG_TRIPLET=${{ matrix.platform.triplet }}" \
            -w /workspace \
            "$MUSL_IMAGE" \
            sh -c "
              set -e
              set -o pipefail

              echo \"=== ROCKSDB_DIR ===\"
              echo \"\$ROCKSDB_DIR\"

              echo \"=== Architecture ===\"
              uname -m

              echo \"=== Installing packages ===\"
              apk add --no-cache \
                bash \
                build-base \
                cmake \
                curl \
                git \
                linux-headers \
                musl-dev \
                ninja \
                pkgconf \
                zip

              echo \"=== Bootstrapping vcpkg ===\"
              /workspace/vcpkg/bootstrap-vcpkg.sh -musl

              echo \"=== vcpkg directory after ===\"
              find /workspace/vcpkg/downloads || true

              bash /workspace/.github/scripts/build-rocksdb-variants.sh
            "

      - name: Verify LZ4 is packaged
        shell: bash
        run: |
          if [[ "${{ matrix.platform.target }}" == windows-* ]]; then
            test -f "${GITHUB_WORKSPACE}/dist/lib/lz4.lib"
          else
            test -f "${GITHUB_WORKSPACE}/dist/lib/liblz4.a"
          fi

      - name: Create archive
        id: archive
        shell: bash
        run: |
          ARCHIVE="${GITHUB_WORKSPACE}/rocksdb-${{ needs.check.outputs.release_version }}-${{ matrix.platform.target }}.tar.xz"
          cd "${GITHUB_WORKSPACE}/dist"
          tar -cf - . | xz -9 > $ARCHIVE
          echo "archive=$ARCHIVE" >> $GITHUB_OUTPUT

      # Separate from the build's 3.31.10, which has no generator for the VS this image ships.
      - name: Install a CMake that knows the installed Visual Studio (probe only)
        if: ${{ startsWith(matrix.platform.target, 'windows-') && matrix.platform.run_probe }}
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # latest as of 2026-10-04
        with:
          cmakeVersion: 4.4.3

      - name: Verify release archive
        if: ${{ matrix.platform.target != 'linux-x64-musl' && matrix.platform.target != 'linux-arm64-musl' }}
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
          SCRATCH: ${{ github.workspace }}/archive-check
          PROBE_DIR: ${{ github.workspace }}/tools/perf-context-probe
          RUN_PROBE: ${{ matrix.platform.run_probe }}
          PROBE_CMAKE_ARGS: ${{ matrix.platform.probe_cmake_args }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/verify-prebuild-archive.sh"

      # musl binaries cannot run on the glibc runner, so the archive is verified where it was built.
      - name: Verify release archive (linux musl)
        if: ${{ matrix.platform.target == 'linux-x64-musl' || matrix.platform.target == 'linux-arm64-musl' }}
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e "ARCHIVE=/workspace/rocksdb-${{ needs.check.outputs.release_version }}-${{ matrix.platform.target }}.tar.xz" \
            -e SCRATCH=/workspace/archive-check \
            -e PROBE_DIR=/workspace/tools/perf-context-probe \
            -e "RUN_PROBE=${{ matrix.platform.run_probe }}" \
            -w /workspace \
            "$MUSL_IMAGE" \
            sh -c "
              set -e
              # grep: the verifier counts markers in a static library, and BusyBox grep does not
              # handle binary input or -o counting dependably.
              apk add --no-cache bash binutils build-base cmake grep ninja xz
              bash /workspace/.github/scripts/verify-prebuild-archive.sh
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rocksdb-${{ needs.check.outputs.release_version }}-${{ matrix.platform.target }}
          path: ${{ steps.archive.outputs.archive }}

  release:
    name: Release
    needs: [check, build]
    if: ${{ needs.check.outputs.should_build == 'true' }}
    outputs:
      lost_race: ${{ steps.publish-release.outputs.lost_race }}
    # Two runs can clear the approximate workflow-level key and still resolve to the
    # same release_version.
    concurrency:
      group: release-${{ needs.check.outputs.release_version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish complete GitHub release
        id: publish-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MISMATCH_NOTE: ${{ needs.check.outputs.mismatch_note }}
          PRERELEASE: ${{ inputs.prerelease_revision != '' || needs.check.outputs.experimental_dirs != '' }}
          EXPERIMENTAL_NOTE: ${{ needs.check.outputs.experimental_note }}
          ROCKSDB_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_VERSION: ${{ needs.check.outputs.release_version }}
        run: |
          set -euo pipefail

          TAG_NAME="v$RELEASE_VERSION"
          OWNER_MARKER="<!-- rocksdb-prebuilds-owner:$GITHUB_RUN_ID -->"
          COMPLETE_MARKER="<!-- rocksdb-prebuilds-complete -->"
          RELEASE_BODY="$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            "Automated prebuilds for RocksDB v$RELEASE_VERSION." \
            "$MISMATCH_NOTE" \
            "$EXPERIMENTAL_NOTE" \
            "Built from upstream tag v$ROCKSDB_VERSION — release notes: https://github.com/facebook/rocksdb/releases/tag/v$ROCKSDB_VERSION" \
            "Each archive contains two builds of RocksDB from the same source, patches and configuration, differing only in \`WITH_PERF_CONTEXT\`. \`lib/librocksdb.a\` (\`lib/rocksdb.lib\` on Windows) has PerfContext enabled, as every previous release did. \`lib/no-perf-context/librocksdb.a\` (\`lib/no-perf-context/rocksdb.lib\`) has it compiled out (\`NPERF_CONTEXT\`): linking it drops the thread-local counter update on every key comparison, and in exchange \`get_perf_context()\` counters stay zero and the \`rocksdb.db.mutex.wait.micros\` statistic is never recorded. The public headers, the dependency libraries and the CMake and pkg-config packages are shared by both, and describe the enabled library." \
            "$OWNER_MARKER")"

          get_releases() {
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq --arg tag "$TAG_NAME" '[.[][] | select(.tag_name == $tag)]'
          }

          RELEASES="$(get_releases)"
          RELEASE_COUNT="$(jq 'length' <<< "$RELEASES")"
          if [[ "$RELEASE_COUNT" -gt 1 ]]; then
            echo "Multiple GitHub releases claim $TAG_NAME; refusing to publish" >&2
            exit 1
          fi

          if [[ "$RELEASE_COUNT" -eq 1 ]]; then
            RELEASE="$(jq '.[0]' <<< "$RELEASES")"
            OWNER_COUNT="$(jq '[(.body // "") | scan("<!-- rocksdb-prebuilds-owner:[0-9]+ -->")] | unique | length' <<< "$RELEASE")"
            if [[ "$OWNER_COUNT" -ne 1 ]]; then
              echo "GitHub release $TAG_NAME has missing or ambiguous ownership metadata" >&2
              exit 1
            fi

            OWNED_BY_THIS_RUN="$(jq --arg marker "$OWNER_MARKER" '(.body // "") | contains($marker)' <<< "$RELEASE")"
            IS_COMPLETE="$(jq --arg marker "$COMPLETE_MARKER" '(.body // "") | contains($marker)' <<< "$RELEASE")"
            IS_DRAFT="$(jq '.draft' <<< "$RELEASE")"

            if [[ "$IS_DRAFT" == false ]]; then
              if [[ "$IS_COMPLETE" != true ]]; then
                echo "Published GitHub release $TAG_NAME has no completion marker; refusing to treat it as complete" >&2
                exit 1
              elif [[ "$OWNED_BY_THIS_RUN" != true ]]; then
                echo "lost_race=true" >> "$GITHUB_OUTPUT"
                echo "::warning title=Release already published::$TAG_NAME was completed by another run while this one was building; skipping publish."
                exit 0
              fi

              echo "GitHub release $TAG_NAME was already completed by this run; continuing with its S3 mirror"
              exit 0
            elif [[ "$OWNED_BY_THIS_RUN" != true ]]; then
              # A draft is only another run's to keep while that run is still going. One left behind
              # by a finished run would otherwise block the tag until someone deleted it by hand.
              OWNER_RUN_ID="$(jq -r '(.body // "") | capture("<!-- rocksdb-prebuilds-owner:(?<id>[0-9]+) -->").id' <<< "$RELEASE")"
              OWNER_RUN_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OWNER_RUN_ID" --jq '.status' 2>/dev/null || echo unknown)"
              if [[ "$OWNER_RUN_STATUS" != completed ]]; then
                echo "Draft GitHub release $TAG_NAME belongs to run $OWNER_RUN_ID, which is $OWNER_RUN_STATUS; refusing to overwrite it" >&2
                exit 1
              fi
              echo "Reclaiming draft GitHub release $TAG_NAME from completed run $OWNER_RUN_ID"
              RECLAIM_PAYLOAD="$(jq -n --arg body "$RELEASE_BODY" '{body:$body}')"
              RELEASE="$(gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/releases/$(jq -r '.id' <<< "$RELEASE")" --input - <<< "$RECLAIM_PAYLOAD")"
              if [[ "$(jq --arg marker "$OWNER_MARKER" '(.body // "") | contains($marker)' <<< "$RELEASE")" != true ]]; then
                echo "Could not take ownership of draft GitHub release $TAG_NAME" >&2
                exit 1
              fi
            fi

            RELEASE_ID="$(jq -r '.id' <<< "$RELEASE")"
          else
            CREATE_PAYLOAD="$(jq -n \
              --arg tag "$TAG_NAME" \
              --arg target "$GITHUB_SHA" \
              --arg name "RocksDB v$RELEASE_VERSION" \
              --arg body "$RELEASE_BODY" \
              --argjson prerelease "$PRERELEASE" \
              '{tag_name:$tag, target_commitish:$target, name:$name, body:$body, draft:true, prerelease:$prerelease}')"
            RELEASE="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input - <<< "$CREATE_PAYLOAD")"
            RELEASE_ID="$(jq -r '.id' <<< "$RELEASE")"

            # The releases list is not read-after-write consistent: a draft created a moment ago can
            # be absent from it. Only a list that still disagrees after several reads means another
            # run claimed the tag.
            for attempt in 1 2 3 4 5; do
              RELEASES="$(get_releases)"
              RELEASE_MATCHES="$(jq 'length' <<< "$RELEASES")"
              if [[ "$RELEASE_MATCHES" -gt 1 ]]; then
                break
              fi
              if [[ "$RELEASE_MATCHES" -eq 1 ]] && [[ "$(jq -r '.[0].id' <<< "$RELEASES")" == "$RELEASE_ID" ]]; then
                break
              fi
              echo "Release $TAG_NAME not yet listed after creating $RELEASE_ID (attempt $attempt)"
              sleep $((attempt * 3))
            done
            if [[ "$(jq 'length' <<< "$RELEASES")" -ne 1 ]] ||
              [[ "$(jq -r '.[0].id' <<< "$RELEASES")" != "$RELEASE_ID" ]]; then
              echo "Unable to establish unique ownership of GitHub release $TAG_NAME" >&2
              exit 1
            fi
            RELEASE="$(jq '.[0]' <<< "$RELEASES")"
            if [[ "$(jq '.draft' <<< "$RELEASE")" != true ]] ||
              [[ "$(jq --arg marker "$OWNER_MARKER" '(.body // "") | contains($marker)' <<< "$RELEASE")" != true ]]; then
              echo "New GitHub release $TAG_NAME is not a run-owned draft" >&2
              exit 1
            fi
          fi

          mapfile -d '' ASSETS < <(find artifacts -type f -name '*.tar.xz' -print0 | sort -z)
          if [[ "${#ASSETS[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          DUPLICATE_NAMES="$(printf '%s\n' "${ASSETS[@]##*/}" | LC_ALL=C sort | uniq -d)"
          if [[ -n "$DUPLICATE_NAMES" ]]; then
            echo "Duplicate release asset names:" >&2
            printf '%s\n' "$DUPLICATE_NAMES" >&2
            exit 1
          fi

          while IFS= read -r ASSET_ID; do
            [[ -z "$ASSET_ID" ]] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          done < <(jq -r '.assets[].id' <<< "$RELEASE")

          for ASSET in "${ASSETS[@]}"; do
            ASSET_NAME="${ASSET##*/}"
            if [[ ! "$ASSET_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Unsafe release asset name: $ASSET_NAME" >&2
              exit 1
            fi
            curl --fail-with-body --silent --show-error \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$ASSET" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ASSET_NAME" >/dev/null
          done

          EXPECTED_ASSETS="$(mktemp)"
          ACTUAL_ASSETS="$(mktemp)"
          for ASSET in "${ASSETS[@]}"; do
            printf '%s\t%s\n' "${ASSET##*/}" "$(wc -c < "$ASSET" | tr -d '[:space:]')"
          done | LC_ALL=C sort > "$EXPECTED_ASSETS"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | [.name, .size] | @tsv' | LC_ALL=C sort > "$ACTUAL_ASSETS"
          if ! diff -u "$EXPECTED_ASSETS" "$ACTUAL_ASSETS"; then
            echo "Draft release assets do not exactly match this run's artifacts" >&2
            exit 1
          fi

          FINAL_PAYLOAD="$(jq -n \
            --arg body "$RELEASE_BODY"$'\n\n'"$COMPLETE_MARKER" \
            --argjson prerelease "$PRERELEASE" \
            '{body:$body, draft:false, prerelease:$prerelease}')"
          PUBLISHED="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input - <<< "$FINAL_PAYLOAD")"
          if [[ "$(jq '.draft == false' <<< "$PUBLISHED")" != true ]] ||
            [[ "$(jq --arg marker "$COMPLETE_MARKER" '(.body // "") | contains($marker)' <<< "$PUBLISHED")" != true ]]; then
            echo "GitHub release $TAG_NAME did not finalize with its completion marker" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        if: ${{ steps.publish-release.outputs.lost_race != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload artifacts to S3
        if: ${{ steps.publish-release.outputs.lost_race != 'true' }}
        run: |
          aws s3 sync artifacts/ s3://harper-artifacts/rocksdb-prebuilds/v${{ needs.check.outputs.release_version }}/ --delete

  on-release-success:
    if: success() && !cancelled() && needs.check.outputs.should_build == 'true' && needs.release.outputs.lost_race != 'true'
    name: Release success
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CI_CHANNEL_ID }}",
              "text": "New RocksDB prebuild: v${{ needs.check.outputs.release_version }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "New RocksDB prebuild: v${{ needs.check.outputs.release_version }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": ":white_check_mark:"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<https://github.com/harperdb/rocksdb-prebuilds/releases/tag/v${{ needs.check.outputs.release_version }}|GitHub Release>"
                    }
                  ]
                }
              ]
            }

      - name: Repository Dispatch
        if: ${{ inputs.prerelease_revision == '' && needs.check.outputs.experimental_dirs == '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: new-rocksdb-prebuild
          repository: harperdb/rocksdb-js
          token: ${{ secrets.GH_TOKEN }}
          client-payload: |
            {
              "url": "https://github.com/harperdb/rocksdb-prebuilds/releases/tag/v${{ needs.check.outputs.release_version }}",
              "version": "${{ needs.check.outputs.release_version }}"
            }

  on-release-failure:
    if: failure() && !cancelled() && needs.check.outputs.should_build == 'true'
    name: Release failure
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CI_CHANNEL_ID }}",
              "text": "RocksDB prebuild failed: v${{ needs.check.outputs.release_version }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "RocksDB prebuild failed: v${{ needs.check.outputs.release_version }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": ":x:"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run ${{ github.run_id }}>"
                    }
                  ]
                }
              ]
            }
